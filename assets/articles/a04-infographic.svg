<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="100%" height="100%">
    <rect width="1200" height="540" fill="#F8FAFC" rx="16" stroke="#D6DFE8" stroke-width="2"/>
    <rect x="40" y="30" width="1120" height="60" rx="10" fill="#D97757"/>
    <text x="60" y="68" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="18" fill="#FFFFFF">A04 — DRAGON BALL DAIMA</text>
    <g transform="translate(60, 120)">
      <rect x="0" y="0" width="250" height="360" rx="12" fill="#FFFFFF" stroke="#D6DFE8" stroke-width="1.5"/>
      <circle cx="35" cy="35" r="18" fill="#D97757"/>
      <text x="35" y="41" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">1</text>
      <text x="65" y="42" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="16" fill="#243247">Dự án DAIMA</text>
      <line x1="20" y1="70" x2="230" y2="70" stroke="#D6DFE8" stroke-width="1"/>
      <text x="20" y="100" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#53647A">• Tác phẩm kỷ niệm 40 năm</text>
      <text x="20" y="130" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#53647A">• Cốt truyện bởi Akira Toriyama</text>
      <text x="20" y="160" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#53647A">• Nhân vật biến nhỏ</text>
      <rect x="15" y="250" width="220" height="90" rx="8" fill="#F5F7FB" stroke="#D6DFE8"/>
      <text x="25" y="280" font-family="'Be Vietnam Pro', sans-serif" font-weight="600" font-size="12" fill="#D97757">LƯU Ý CỐT LÕI:</text>
      <text x="25" y="305" font-family="'Be Vietnam Pro', sans-serif" font-size="11" fill="#53647A">Phân biệt dự án canon với các bản spin-off.</text>
    </g><g transform="translate(330, 120)">
      <rect x="0" y="0" width="250" height="360" rx="12" fill="#FFFFFF" stroke="#D6DFE8" stroke-width="1.5"/>
      <circle cx="35" cy="35" r="18" fill="#D97757"/>
      <text x="35" y="41" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">2</text>
      <text x="65" y="42" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="16" fill="#243247">Bối cảnh mở đầu</text>
      <line x1="20" y1="70" x2="230" y2="70" stroke="#D6DFE8" stroke-width="1"/>
      <text x="20" y="100" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#53647A">• Nối tiếp sau Majin Buu</text>
      <text x="20" y="130" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#53647A">• Vương quốc Ma Giới</text>
      <text x="20" y="160" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#53647A">• Cốt truyện độc lập dễ theo</text>
      <rect x="15" y="250" width="220" height="90" rx="8" fill="#F5F7FB" stroke="#D6DFE8"/>
      <text x="25" y="280" font-family="'Be Vietnam Pro', sans-serif" font-weight="600" font-size="12" fill="#D97757">LƯU Ý CỐT LÕI:</text>
      <text x="25" y="305" font-family="'Be Vietnam Pro', sans-serif" font-size="11" fill="#53647A">Người mới không bắt buộc xem hết 500 tập cũ.</text>
    </g><g transform="translate(600, 120)">
      <rect x="0" y="0" width="250" height="360" rx="12" fill="#FFFFFF" stroke="#D6DFE8" stroke-width="1.5"/>
      <circle cx="35" cy="35" r="18" fill="#D97757"/>
      <text x="35" y="41" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">3</text>
      <text x="65" y="42" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="16" fill="#243247">Tìm nguồn xem</text>
      <line x1="20" y1="70" x2="230" y2="70" stroke="#D6DFE8" stroke-width="1"/>
      <text x="20" y="100" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#53647A">• Nền tảng có bản quyền</text>
      <text x="20" y="130" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#53647A">• Kiểm tra theo khu vực</text>
      <text x="20" y="160" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#53647A">• Tránh link lậu mã độc</text>
      <rect x="15" y="250" width="220" height="90" rx="8" fill="#F5F7FB" stroke="#D6DFE8"/>
      <text x="25" y="280" font-family="'Be Vietnam Pro', sans-serif" font-weight="600" font-size="12" fill="#D97757">LƯU Ý CỐT LÕI:</text>
      <text x="25" y="305" font-family="'Be Vietnam Pro', sans-serif" font-size="11" fill="#53647A">Ủng hộ đơn vị phát hành chính thức.</text>
    </g><g transform="translate(870, 120)">
      <rect x="0" y="0" width="250" height="360" rx="12" fill="#FFFFFF" stroke="#D6DFE8" stroke-width="1.5"/>
      <circle cx="35" cy="35" r="18" fill="#D97757"/>
      <text x="35" y="41" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">4</text>
      <text x="65" y="42" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="16" fill="#243247">Tránh spoiler</text>
      <line x1="20" y1="70" x2="230" y2="70" stroke="#D6DFE8" stroke-width="1"/>
      <text x="20" y="100" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#53647A">• Tôn trọng trải nghiệm</text>
      <text x="20" y="130" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#53647A">• Phân biệt tin chính thức</text>
      <text x="20" y="160" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#53647A">• Theo dõi thông báo gốc</text>
      <rect x="15" y="250" width="220" height="90" rx="8" fill="#F5F7FB" stroke="#D6DFE8"/>
      <text x="25" y="280" font-family="'Be Vietnam Pro', sans-serif" font-weight="600" font-size="12" fill="#D97757">LƯU Ý CỐT LÕI:</text>
      <text x="25" y="305" font-family="'Be Vietnam Pro', sans-serif" font-size="11" fill="#53647A">Cập nhật từ trang chủ Dragon Ball Official.</text>
    </g>
  </svg>