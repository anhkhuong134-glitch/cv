<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="100%" height="100%">
    <rect width="1200" height="540" fill="#F8FAFC" rx="16" stroke="#D6DFE8" stroke-width="2"/>
    <rect x="40" y="30" width="1120" height="60" rx="10" fill="#2F6257"/>
    <text x="60" y="68" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="18" fill="#FFFFFF">A09 — CÂY TRONG NHÀ ÍT SÁNG</text>
    <g transform="translate(60, 120)">
      <rect x="0" y="0" width="250" height="360" rx="12" fill="#FFFFFF" stroke="#D6DFE8" stroke-width="1.5"/>
      <circle cx="35" cy="35" r="18" fill="#2F6257"/>
      <text x="35" y="41" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">1</text>
      <text x="65" y="42" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="16" fill="#243247">Quan sát ánh sáng</text>
      <line x1="20" y1="70" x2="230" y2="70" stroke="#D6DFE8" stroke-width="1"/>
      <text x="20" y="100" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#53647A">• Khoảng cách tới cửa sổ</text>
      <text x="20" y="130" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#53647A">• Hướng nắng (Đông/Tây)</text>
      <text x="20" y="160" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#53647A">• Ánh sáng tán xạ</text>
      <rect x="15" y="250" width="220" height="90" rx="8" fill="#F5F7FB" stroke="#D6DFE8"/>
      <text x="25" y="280" font-family="'Be Vietnam Pro', sans-serif" font-weight="600" font-size="12" fill="#2F6257">LƯU Ý CỐT LÕI:</text>
      <text x="25" y="305" font-family="'Be Vietnam Pro', sans-serif" font-size="11" fill="#53647A">Phân biệt cây chịu bóng với cây sống không cần sáng.</text>
    </g><g transform="translate(330, 120)">
      <rect x="0" y="0" width="250" height="360" rx="12" fill="#FFFFFF" stroke="#D6DFE8" stroke-width="1.5"/>
      <circle cx="35" cy="35" r="18" fill="#2F6257"/>
      <text x="35" y="41" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">2</text>
      <text x="65" y="42" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="16" fill="#243247">Chọn loài phù hợp</text>
      <line x1="20" y1="70" x2="230" y2="70" stroke="#D6DFE8" stroke-width="1"/>
      <text x="20" y="100" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#53647A">• Cây Lưỡi Hổ (Sansevieria)</text>
      <text x="20" y="130" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#53647A">• Cây Kim Tiền (ZZ Plant)</text>
      <text x="20" y="160" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#53647A">• Cây Trầu Bà (Pothos)</text>
      <rect x="15" y="250" width="220" height="90" rx="8" fill="#F5F7FB" stroke="#D6DFE8"/>
      <text x="25" y="280" font-family="'Be Vietnam Pro', sans-serif" font-weight="600" font-size="12" fill="#2F6257">LƯU Ý CỐT LÕI:</text>
      <text x="25" y="305" font-family="'Be Vietnam Pro', sans-serif" font-size="11" fill="#53647A">Chọn cây dễ sống cho người mới bắt đầu.</text>
    </g><g transform="translate(600, 120)">
      <rect x="0" y="0" width="250" height="360" rx="12" fill="#FFFFFF" stroke="#D6DFE8" stroke-width="1.5"/>
      <circle cx="35" cy="35" r="18" fill="#2F6257"/>
      <text x="35" y="41" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">3</text>
      <text x="65" y="42" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="16" fill="#243247">Giá thể &amp; thoát nước</text>
      <line x1="20" y1="70" x2="230" y2="70" stroke="#D6DFE8" stroke-width="1"/>
      <text x="20" y="100" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#53647A">• Chậu có lỗ thoát nước</text>
      <text x="20" y="130" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#53647A">• Đất tơi xốp thoáng khí</text>
      <text x="20" y="160" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#53647A">• Tránh úng rễ đáy chậu</text>
      <rect x="15" y="250" width="220" height="90" rx="8" fill="#F5F7FB" stroke="#D6DFE8"/>
      <text x="25" y="280" font-family="'Be Vietnam Pro', sans-serif" font-weight="600" font-size="12" fill="#2F6257">LƯU Ý CỐT LÕI:</text>
      <text x="25" y="305" font-family="'Be Vietnam Pro', sans-serif" font-size="11" fill="#53647A">Hỏi về chậu và đất trồng cùng lúc khi mua cây.</text>
    </g><g transform="translate(870, 120)">
      <rect x="0" y="0" width="250" height="360" rx="12" fill="#FFFFFF" stroke="#D6DFE8" stroke-width="1.5"/>
      <circle cx="35" cy="35" r="18" fill="#2F6257"/>
      <text x="35" y="41" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">4</text>
      <text x="65" y="42" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="16" fill="#243247">Tần suất tưới</text>
      <line x1="20" y1="70" x2="230" y2="70" stroke="#D6DFE8" stroke-width="1"/>
      <text x="20" y="100" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#53647A">• Kiểm tra độ khô của đất</text>
      <text x="20" y="130" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#53647A">• Chọc ngón tay sâu 2-3cm</text>
      <text x="20" y="160" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#53647A">• Tưới đẫm khi đất đã khô</text>
      <rect x="15" y="250" width="220" height="90" rx="8" fill="#F5F7FB" stroke="#D6DFE8"/>
      <text x="25" y="280" font-family="'Be Vietnam Pro', sans-serif" font-weight="600" font-size="12" fill="#2F6257">LƯU Ý CỐT LÕI:</text>
      <text x="25" y="305" font-family="'Be Vietnam Pro', sans-serif" font-size="11" fill="#53647A">Thừa nước nguy hiểm hơn thiếu nước đối với cây ít sáng.</text>
    </g>
  </svg>