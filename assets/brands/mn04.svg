    <path d="M40 50 L200 50 L190 25 L50 25 Z" fill="#2F6257"/>
    <rect x="35" y="48" width="170" height="14" rx="4" fill="#244D44"/>
    <path d="M45 62 L65 410 L175 410 L195 62 Z" fill="#F6F1E8" stroke="#D1CDC2" stroke-width="2"/>
    <path d="M52 170 L60 300 L180 300 L188 170 Z" fill="#E7B080" stroke="#D1CDC2"/>
    <text x="120" y="225" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="18" fill="#593B2F" text-anchor="middle">mẻ nhỏ</text>
    <text x="120" y="248" font-family="'Be Vietnam Pro', sans-serif" font-weight="500" font-size="10" fill="#593B2F" text-anchor="middle">Một khoảng nghỉ,</text>
    <text x="120" y="262" font-family="'Be Vietnam Pro', sans-serif" font-weight="500" font-size="10" fill="#593B2F" text-anchor="middle">một ly theo gu.</text>
  </g>

  <!-- Right: Flat Sleeve Artwork -->
  <g transform="translate(420, 150)">
