<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="800" height="600" fill="#EAE3D8"/>
  <text x="400" y="45" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="20" fill="#593B2F" text-anchor="middle">MN04 · Ly Giấy Concept &amp; Sleeve Cách Nhiệt</text>

  <!-- Left: Takeaway Cup Mockup -->
  <g transform="translate(140, 90)">
