<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="100%" height="100%">
  <rect width="1000" height="550" fill="#FAFBF8"/>
  <text x="500" y="40" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="20" fill="#593B2F" text-anchor="middle">MN-V1 · Storyboard Kịch Bản Video 20 Giây “Thẻ Hỏi Gu Trước Khi Mua”</text>

  <!-- 4 Scenes -->
  <g transform="translate(40, 70)">
    <rect x="0" y="0" width="215" height="400" rx="10" fill="#F6F1E8" stroke="#D1CDC2" stroke-width="1.5"/>
    <rect x="0" y="0" width="215" height="32" rx="10" fill="#593B2F"/>
    <text x="107" y="21" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" text-anchor="middle">0:00 - 0:05</text>
    <text x="12" y="60" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="11" fill="#2F6257">CẢNH 1: BỐI RỐI TẠI QUẦY</text>
    <rect x="12" y="75" width="191" height="130" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="107" y="130" font-family="'Be Vietnam Pro', sans-serif" font-size="10.5" fill="#53647A" text-anchor="middle">
      <tspan x="107" dy="0">Khách đứng trước kệ hạt</tspan>
      <tspan x="107" dy="16">ngập ngừng: “Cho mình loại ngon nhất...”</tspan>
    </text>
    <rect x="12" y="220" width="191" height="160" rx="6" fill="#FFFDF5" stroke="#E7B080"/>
    <text x="22" y="242" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="10.5" fill="#B7791F">LỜI THOẠI:</text>
    <text x="22" y="270" font-family="'Be Vietnam Pro', sans-serif" font-size="11" fill="#243247" font-style="italic">Voice: Bạn từng lúng túng</text>
    <text x="22" y="292" font-family="'Be Vietnam Pro', sans-serif" font-size="11" fill="#243247" font-style="italic">khi bước vào quầy mua hạt?</text>
  </g>

  <g transform="translate(275, 70)">
    <rect x="0" y="0" width="215" height="400" rx="10" fill="#F6F1E8" stroke="#D1CDC2" stroke-width="1.5"/>
    <rect x="0" y="0" width="215" height="32" rx="10" fill="#593B2F"/>
    <text x="107" y="21" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" text-anchor="middle">0:05 - 0:10</text>
    <text x="12" y="60" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="11" fill="#2F6257">CẢNH 2: RÚT THẺ HỎI GU</text>
    <rect x="12" y="75" width="191" height="130" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="107" y="130" font-family="'Be Vietnam Pro', sans-serif" font-size="10.5" fill="#53647A" text-anchor="middle">
      <tspan x="107" dy="0">Cận cảnh tay rút thẻ nhỏ</tspan>
      <tspan x="107" dy="16">có 3 câu tick: Đen/Sữa/Dụng cụ</tspan>
    </text>
    <rect x="12" y="220" width="191" height="160" rx="6" fill="#FFFDF5" stroke="#E7B080"/>
    <text x="22" y="242" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="10.5" fill="#B7791F">LỜI THOẠI:</text>
    <text x="22" y="270" font-family="'Be Vietnam Pro', sans-serif" font-size="11" fill="#243247" font-style="italic">Voice: Chỉ cần 3 câu hỏi</text>
    <text x="22" y="292" font-family="'Be Vietnam Pro', sans-serif" font-size="11" fill="#243247" font-style="italic">trên một chiếc thẻ gấp nhỏ.</text>
  </g>

  <g transform="translate(510, 70)">
    <rect x="0" y="0" width="215" height="400" rx="10" fill="#F6F1E8" stroke="#D1CDC2" stroke-width="1.5"/>
    <rect x="0" y="0" width="215" height="32" rx="10" fill="#593B2F"/>
    <text x="107" y="21" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" text-anchor="middle">0:10 - 0:15</text>
    <text x="12" y="60" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="11" fill="#2F6257">CẢNH 3: BARISTA TƯ VẤN</text>
    <rect x="12" y="75" width="191" height="130" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="107" y="130" font-family="'Be Vietnam Pro', sans-serif" font-size="10.5" fill="#53647A" text-anchor="middle">
      <tspan x="107" dy="0">Barista mỉm cười gật đầu,</tspan>
      <tspan x="107" dy="16">lấy đúng gói hạt rang vừa</tspan>
    </text>
    <rect x="12" y="220" width="191" height="160" rx="6" fill="#FFFDF5" stroke="#E7B080"/>
    <text x="22" y="242" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="10.5" fill="#B7791F">LỜI THOẠI:</text>
    <text x="22" y="270" font-family="'Be Vietnam Pro', sans-serif" font-size="11" fill="#243247" font-style="italic">Voice: Người bán sẽ biết</text>
    <text x="22" y="292" font-family="'Be Vietnam Pro', sans-serif" font-size="11" fill="#243247" font-style="italic">chính xác gói hạt dành cho bạn.</text>
  </g>

  <g transform="translate(745, 70)">
    <rect x="0" y="0" width="215" height="400" rx="10" fill="#F6F1E8" stroke="#D1CDC2" stroke-width="1.5"/>
    <rect x="0" y="0" width="215" height="32" rx="10" fill="#593B2F"/>
    <text x="107" y="21" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="11" fill="#FFFFFF" text-anchor="middle">0:15 - 0:20</text>
    <text x="12" y="60" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="11" fill="#2F6257">CẢNH 4: LY TẠI NHÀ &amp; CTA</text>
    <rect x="12" y="75" width="191" height="130" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="107" y="130" font-family="'Be Vietnam Pro', sans-serif" font-size="10.5" fill="#53647A" text-anchor="middle">
      <tspan x="107" dy="0">Rót ly thơm sáng sớm.</tspan>
      <tspan x="107" dy="16">Hiện CTA: Tải thẻ hỏi gu</tspan>
    </text>
    <rect x="12" y="220" width="191" height="160" rx="6" fill="#FFFDF5" stroke="#E7B080"/>
    <text x="22" y="242" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="10.5" fill="#B7791F">LỜI THOẠI:</text>
    <text x="22" y="270" font-family="'Be Vietnam Pro', sans-serif" font-size="11" fill="#243247" font-style="italic">Voice: Pha ly theo đúng gu bạn.</text>
    <text x="22" y="292" font-family="'Be Vietnam Pro', sans-serif" font-size="11" fill="#243247" font-style="italic">Tải mẫu thẻ in tại link bio.</text>
  </g>

  <text x="500" y="505" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#593B2F" text-anchor="middle">Kịch bản phân cảnh chuẩn bị sản xuất (Pre-production Storyboard) · Chưa triển khai quay video thực tế</text>
</svg>