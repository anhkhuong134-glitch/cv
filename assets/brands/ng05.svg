  <text x="600" y="415" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#53647A" text-anchor="middle">Chuỗi nội dung giáo dục người dùng: Tháo gỡ nỗi sợ trang trắng, hướng dẫn phân bổ trang tuần và kêu gọi tải template</text>
