<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="100%" height="100%">
  <rect width="1000" height="360" fill="#EAE7DF"/>
  <text x="500" y="36" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="18" fill="#273B4A" text-anchor="middle">NG04 · Đai Giấy Bọc Sổ (Belly Band Flat Artwork)</text>

  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="880" height="220" rx="8" fill="#FAFBF8" stroke="#CBD5E1" stroke-width="2"/>
    
    <!-- Left flap -->
    <rect x="0" y="0" width="180" height="220" fill="#F4F2EC"/>
    <line x1="180" y1="0" x2="180" y2="220" stroke="#CBD5E1" stroke-dasharray="4 4"/>
    <text x="90" y="60" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="12" fill="#53647A" text-anchor="middle">THÔNG SỐ GIẤY</text>
    <text x="20" y="90" font-family="'Be Vietnam Pro', sans-serif" font-size="11" fill="#53647A">• Ruột giấy kem 100gsm</text>
    <text x="20" y="115" font-family="'Be Vietnam Pro', sans-serif" font-size="11" fill="#53647A">• Chống lem mực gel/máy</text>
    <text x="20" y="140" font-family="'Be Vietnam Pro', sans-serif" font-size="11" fill="#53647A">• Khổ A5 (148 × 210mm)</text>
    <text x="20" y="165" font-family="'Be Vietnam Pro', sans-serif" font-size="11" fill="#53647A">• 160 trang kẻ dot 5mm</text>

    <!-- Center face -->
    <g transform="translate(240, 45)">
      <rect x="0" y="0" width="40" height="40" rx="4" fill="#FFFFFF" stroke="#273B4A" stroke-width="2"/>
      <path d="M24 0 L40 16 L24 16 Z" fill="#F2D97C" stroke="#273B4A" stroke-width="1"/>
      <line x1="8" y1="24" x2="20" y2="24" stroke="#273B4A" stroke-width="2"/>
      <text x="52" y="22" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="20" fill="#273B4A">nếp gấp</text>
      <text x="52" y="38" font-family="'Be Vietnam Pro', sans-serif" font-weight="500" font-size="11" fill="#53647A">sổ tay ghi chép có cấu trúc</text>

      <text x="0" y="85" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="22" fill="#273B4A">Ghi một ý, mở một hướng.</text>
      <text x="0" y="110" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#53647A">Thử cách ghi trên một trang trước khi chọn một cuốn sổ.</text>
    </g>

    <!-- Right flap -->
    <line x1="680" y1="0" x2="680" y2="220" stroke="#CBD5E1" stroke-dasharray="4 4"/>
    <rect x="680" y="0" width="200" height="220" fill="#F4F2EC"/>
    <text x="780" y="60" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="12" fill="#273B4A" text-anchor="middle">MINH BẠCH CONCEPT</text>
    <text x="695" y="95" font-family="'Be Vietnam Pro', sans-serif" font-size="10.5" fill="#53647A">Bản thiết kế concept cá nhân</text>
    <text x="695" y="115" font-family="'Be Vietnam Pro', sans-serif" font-size="10.5" fill="#53647A">Chưa xác nhận nhà in và</text>
    <text x="695" y="135" font-family="'Be Vietnam Pro', sans-serif" font-size="10.5" fill="#53647A">thông số sản xuất hàng loạt.</text>
    <text x="695" y="165" font-family="'Be Vietnam Pro', sans-serif" font-size="10" fill="#A0AEC0" font-style="italic">Không tạo chứng chỉ tái chế/</text>
    <text x="695" y="180" font-family="'Be Vietnam Pro', sans-serif" font-size="10" fill="#A0AEC0" font-style="italic">FSC khi chưa kiểm định.</text>
  </g>

  <text x="500" y="325" font-family="'Be Vietnam Pro', sans-serif" font-size="12.5" fill="#53647A" text-anchor="middle">Kích thước đai trải phẳng bọc ngang sổ A5: mặt chính nhận diện thương hiệu, tai gập ghi quy cách ruột giấy và lưu ý concept</text>
</svg>