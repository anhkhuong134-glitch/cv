<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650" width="100%" height="100%">
  <rect width="1100" height="650" fill="#FAFBF8"/>
  <text x="550" y="40" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="20" fill="#593B2F" text-anchor="middle">MN05 · Bộ Banner Đa Nền Tảng “Pha theo gu của bạn”</text>

  <!-- Banner 1: Web Landscape -->
  <g transform="translate(60, 70)">
    <rect x="0" y="0" width="560" height="290" rx="8" fill="#F6F1E8" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="20" y="30" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="11" fill="#718096">WEB BANNER (1200 × 628)</text>
    <text x="35" y="90" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="24" fill="#593B2F">Pha theo gu của bạn.</text>
    <text x="35" y="125" font-family="'Be Vietnam Pro', sans-serif" font-size="14" fill="#53647A">Bắt đầu từ câu hỏi đơn giản trước khi chọn cà phê.</text>
    <rect x="35" y="160" width="140" height="38" rx="6" fill="#2F6257"/>
    <text x="105" y="184" font-family="'Be Vietnam Pro', sans-serif" font-weight="600" font-size="12" fill="#FFFFFF" text-anchor="middle">Tải phiếu thử ly →</text>
    <ellipse cx="440" cy="140" rx="60" ry="24" fill="#FFFFFF" stroke="#593B2F" stroke-width="2"/>
    <path d="M390 140 Q400 190 440 200 Q480 190 490 140 Z" fill="#FFFFFF" stroke="#593B2F" stroke-width="2"/>
    <circle cx="440" cy="230" r="8" fill="#E7B080"/>
  </g>

  <!-- Banner 2: Square -->
  <g transform="translate(60, 390)">
    <rect x="0" y="0" width="220" height="220" rx="8" fill="#F6F1E8" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="15" y="24" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="10" fill="#718096">FEED VUÔNG (1080 × 1080)</text>
    <text x="20" y="65" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="16" fill="#593B2F">mẻ nhỏ</text>
    <text x="20" y="90" font-family="'Be Vietnam Pro', sans-serif" font-size="12" fill="#53647A">Đen hay thêm sữa?</text>
    <rect x="20" y="120" width="180" height="40" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="110" y="145" font-family="'Be Vietnam Pro', sans-serif" font-size="11" fill="#2F6257" font-weight="600" text-anchor="middle">Ghi phiếu hỏi gu</text>
  </g>

  <!-- Banner 3: Story -->
  <g transform="translate(660, 70)">
    <rect x="0" y="0" width="360" height="540" rx="12" fill="#F6F1E8" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="25" y="35" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="11" fill="#718096">STORY DỌC (1080 × 1920)</text>
    <text x="35" y="100" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="28" fill="#593B2F">Đen hay</text>
    <text x="35" y="135" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="28" fill="#593B2F">thêm sữa?</text>
    <text x="35" y="175" font-family="'Be Vietnam Pro', sans-serif" font-size="14" fill="#53647A">Một câu hỏi nhỏ trước khi mua hạt.</text>

    <!-- Poll simulation -->
    <rect x="35" y="220" width="290" height="120" rx="12" fill="#FFFFFF" stroke="#D1CDC2" stroke-width="1.5"/>
    <rect x="50" y="240" width="120" height="45" rx="8" fill="#593B2F"/>
    <text x="110" y="268" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">ĐEN</text>
    
    <rect x="190" y="240" width="120" height="45" rx="8" fill="#E7B080"/>
    <text x="250" y="268" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="14" fill="#593B2F" text-anchor="middle">SỮA</text>

    <text x="180" y="315" font-family="'Be Vietnam Pro', sans-serif" font-size="11" fill="#718096" text-anchor="middle">Chạm để chọn thói quen của bạn</text>

    <text x="180" y="470" font-family="'Be Vietnam Pro', sans-serif" font-weight="600" font-size="12" fill="#2F6257" text-anchor="middle">VUỐT LÊN ĐỂ TẢI THẺ HỎI GU</text>
  </g>
</svg>