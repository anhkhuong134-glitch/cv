    <text x="14" y="98" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="13" fill="#593B2F">trước khi mua</text>
    <text x="14" y="140" font-family="'Be Vietnam Pro', sans-serif" font-size="10.5" fill="#53647A">Tải template A5 tự in.</text>
    <rect x="25" y="170" width="125" height="75" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
