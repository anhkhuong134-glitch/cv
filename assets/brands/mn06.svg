    <rect x="12" y="14" width="48" height="18" rx="4" fill="#593B2F"/>
    <text x="36" y="27" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="9" fill="#FFFFFF" text-anchor="middle">01</text>
    <circle cx="155" cy="20" r="6" fill="#E7B080"/>
    <text x="14" y="80" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="13" fill="#593B2F">“Loại ngon nhất”</text>
    <text x="14" y="98" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="13" fill="#593B2F">chưa đủ thông tin</text>
    <text x="14" y="140" font-family="'Be Vietnam Pro', sans-serif" font-size="10.5" fill="#53647A">Mỗi người hợp một gu.</text>
    <rect x="25" y="170" width="125" height="75" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="14" y="290" font-family="'Be Vietnam Pro', sans-serif" font-weight="600" font-size="9.5" fill="#2F6257">Vấn đề</text>
  </g>

  <!-- Slide 2 -->
