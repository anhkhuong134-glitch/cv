<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="100%" height="100%">
  <rect width="1200" height="450" fill="#FAFBF8"/>
  <text x="600" y="35" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="18" fill="#593B2F" text-anchor="middle">MN06 · Carousel “Năm Điều Nói Với Người Bán Cà Phê” (6 Slide)</text>

  <!-- Slide 1 -->
  <g transform="translate(30, 65)">
