  <text x="600" y="415" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#53647A" text-anchor="middle">Case study nội dung C02: Dẫn dắt người mua tự tin đối thoại với barista để chọn đúng dòng cà phê hợp khẩu vị</text>
