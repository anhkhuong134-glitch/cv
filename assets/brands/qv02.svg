<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 550" width="100%" height="100%">
  <rect width="700" height="550" fill="#FAFBF8"/>
  <text x="350" y="40" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="18" fill="#2F435C" text-anchor="middle">QV02 · Hangtag Hai Mặt 60 × 100mm</text>

  <!-- Mặt Trước -->
  <g transform="translate(120, 80)">
    <rect x="0" y="0" width="200" height="360" rx="12" fill="#EEE8DF" stroke="#2F435C" stroke-width="2"/>
    <circle cx="100" cy="30" r="8" fill="#FFFFFF" stroke="#2F435C" stroke-width="2"/>
    
    <g transform="translate(80, 90)">
      <path d="M15 35 L15 15 Q22 7 30 15 L30 35" fill="none" stroke="#2F435C" stroke-width="4" stroke-linecap="round"/>
      <rect x="5" y="30" width="35" height="35" rx="4" fill="none" stroke="#2F435C" stroke-width="3"/>
    </g>

    <text x="100" y="190" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="18" fill="#2F435C" text-anchor="middle">QUAI VẢI</text>
    <text x="100" y="220" font-family="'Be Vietnam Pro', sans-serif" font-weight="600" font-size="12" fill="#C47E71" text-anchor="middle">Mang vừa một ngày.</text>
    <line x1="60" y1="240" x2="140" y2="240" stroke="#2F435C" stroke-width="1.5"/>

    <text x="100" y="310" font-family="'Be Vietnam Pro', sans-serif" font-size="10.5" fill="#53647A" text-anchor="middle">Chọn từ đồ bạn mang</text>
  </g>

  <!-- Mặt Sau -->
  <g transform="translate(380, 80)">
    <rect x="0" y="0" width="200" height="360" rx="12" fill="#FAFBF8" stroke="#2F435C" stroke-width="2"/>
    <circle cx="100" cy="30" r="8" fill="#FFFFFF" stroke="#2F435C" stroke-width="2"/>

    <text x="100" y="70" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="12" fill="#2F435C" text-anchor="middle">HƯỚNG DẪN BẢO QUẢN</text>
    <line x1="30" y1="85" x2="170" y2="85" stroke="#E2E8F0"/>

    <text x="25" y="115" font-family="'Be Vietnam Pro', sans-serif" font-size="11" fill="#53647A">• Giặt tay với nước lạnh</text>
    <text x="25" y="140" font-family="'Be Vietnam Pro', sans-serif" font-size="11" fill="#53647A">• Tránh vắt xoắn mạnh</text>
    <text x="25" y="165" font-family="'Be Vietnam Pro', sans-serif" font-size="11" fill="#53647A">• Phơi trong bóng râm</text>
    <text x="25" y="190" font-family="'Be Vietnam Pro', sans-serif" font-size="11" fill="#53647A">• Không sấy nhiệt cao</text>

    <rect x="20" y="230" width="160" height="80" rx="6" fill="#F1F5F9"/>
    <text x="100" y="255" font-family="'Be Vietnam Pro', sans-serif" font-weight="600" font-size="9.5" fill="#2F435C" text-anchor="middle">MINH BẠCH CONCEPT</text>
    <text x="100" y="275" font-family="'Be Vietnam Pro', sans-serif" font-size="9" fill="#718096" text-anchor="middle">Kích thước và bảo quản</text>
    <text x="100" y="292" font-family="'Be Vietnam Pro', sans-serif" font-size="9" fill="#718096" text-anchor="middle">cần đối chiếu hàng thật</text>
  </g>

  <text x="350" y="490" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#53647A" text-anchor="middle">Hangtag thẻ treo đục lỗ: Mặt trước định vị thương hiệu, mặt sau hướng dẫn chăm sóc vải canvas mộc</text>
</svg>