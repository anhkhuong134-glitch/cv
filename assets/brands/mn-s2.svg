<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <rect width="900" height="500" fill="#EAE3D8"/>
  <text x="450" y="40" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="18" fill="#593B2F" text-anchor="middle">MN-S2 · Story Chữ Hỏi Đáp: “Không Biết Mô Tả Hương Vị Thì Sao?”</text>

  <!-- Frame 1 -->
  <g transform="translate(60, 70)">
    <rect x="0" y="0" width="230" height="370" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="20" y="40" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="11" fill="#718096">BỐI RỐI PHỔ BIẾN</text>
    <text x="20" y="120" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="18" fill="#593B2F">“Không biết</text>
    <text x="20" y="145" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="18" fill="#593B2F">mô tả hương vị</text>
    <text x="20" y="170" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="18" fill="#593B2F">thì hỏi thế nào?”</text>
    <text x="20" y="230" font-family="'Be Vietnam Pro', sans-serif" font-size="12" fill="#53647A">Không cần từ chuyên ngành thử nếm phức tạp.</text>
  </g>

  <!-- Frame 2 -->
  <g transform="translate(335, 70)">
    <rect x="0" y="0" width="230" height="370" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="20" y="40" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="11" fill="#2F6257">CÁCH NÓI ĐƠN GIẢN</text>
    <text x="20" y="90" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#593B2F">Nói điều gần với</text>
    <text x="20" y="110" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="15" fill="#593B2F">cách bạn uống:</text>
    <rect x="20" y="140" width="190" height="130" rx="6" fill="#F6F1E8"/>
    <text x="30" y="170" font-family="'Be Vietnam Pro', sans-serif" font-size="11.5" fill="#593B2F">• Đậm hay nhẹ?</text>
    <text x="30" y="200" font-family="'Be Vietnam Pro', sans-serif" font-size="11.5" fill="#593B2F">• Có uống đá không?</text>
    <text x="30" y="230" font-family="'Be Vietnam Pro', sans-serif" font-size="11.5" fill="#593B2F">• Có thích vị chua nhẹ?</text>
  </g>

  <!-- Frame 3 -->
  <g transform="translate(610, 70)">
    <rect x="0" y="0" width="230" height="370" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="20" y="40" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="11" fill="#718096">CHUẨN BỊ TRƯỚC</text>
    <text x="20" y="120" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="16" fill="#2F6257">Xem phiếu hỏi gu</text>
    <text x="20" y="160" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#53647A">để chuẩn bị những câu còn thiếu trước khi tới tiệm.</text>
    <rect x="20" y="230" width="190" height="42" rx="6" fill="#593B2F"/>
    <text x="115" y="256" font-family="'Be Vietnam Pro', sans-serif" font-weight="600" font-size="12" fill="#FFFFFF" text-anchor="middle">Mở phiếu hỏi gu →</text>
  </g>

  <text x="450" y="475" font-family="'Be Vietnam Pro', sans-serif" font-size="12" fill="#718096" text-anchor="middle">Tháo gỡ rào cản tâm lý người mới: Đơn giản hóa ngôn ngữ chuyên ngành thành cảm nhận đời thường</text>
</svg>