<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <rect width="1200" height="480" fill="#F5F7FB"/>
  <rect x="20" y="20" width="1160" height="440" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Left: Copy &amp; CTA -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="160" height="28" rx="14" fill="#FFFDF5" stroke="#F2D97C" stroke-width="1.5"/>
    <text x="80" y="18" font-family="'Be Vietnam Pro', sans-serif" font-weight="600" font-size="12" fill="#B7791F" text-anchor="middle">🌱 CỬA HÀNG CONCEPT</text>

    <text x="0" y="90" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="36" fill="#273B4A">
      <tspan x="0" dy="0">Chọn trang giấy</tspan>
      <tspan x="0" dy="48">hợp với cách bạn ghi.</tspan>
    </text>

    <text x="0" y="200" font-family="'Be Vietnam Pro', sans-serif" font-size="16" fill="#53647A">
      Thử bố cục trước, chọn sổ sau. Tải miễn phí mẫu ruột lịch tuần A5
    </text>
    <text x="0" y="225" font-family="'Be Vietnam Pro', sans-serif" font-size="16" fill="#53647A">
      để tự in và trải nghiệm trước khi đặt mua.
    </text>

    <!-- Buttons -->
    <g transform="translate(0, 260)">
      <rect x="0" y="0" width="190" height="46" rx="8" fill="#273B4A"/>
      <text x="95" y="28" font-family="'Be Vietnam Pro', sans-serif" font-weight="600" font-size="14" fill="#FFFFFF" text-anchor="middle">Thử lịch tuần miễn phí →</text>

      <rect x="205" y="0" width="140" height="46" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="275" y="28" font-family="'Be Vietnam Pro', sans-serif" font-weight="600" font-size="14" fill="#273B4A" text-anchor="middle">Xem cấu trúc sổ</text>
    </g>
  </g>

  <!-- Right: Rendered Notebook visual -->
  <g transform="translate(680, 70)">
    <ellipse cx="220" cy="330" rx="200" ry="24" fill="#273B4A" opacity="0.08"/>
    <rect x="60" y="20" width="320" height="300" rx="8" fill="#FAFBF8" stroke="#CBD5E1" stroke-width="2"/>
    <path d="M330 20 L380 70 L330 70 Z" fill="#F2D97C" stroke="#273B4A" stroke-width="1.5"/>
    <line x1="85" y1="20" x2="85" y2="320" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="120" y="80" width="32" height="32" rx="4" fill="#FAFBF8" stroke="#273B4A" stroke-width="2"/>
    <text x="160" y="102" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="16" fill="#273B4A">nếp gấp</text>
    <text x="120" y="160" font-family="'Be Vietnam Pro', sans-serif" font-weight="700" font-size="18" fill="#273B4A">Một trang để bắt đầu</text>
    <line x1="120" y1="180" x2="260" y2="180" stroke="#F2D97C" stroke-width="3"/>
  </g>
</svg>