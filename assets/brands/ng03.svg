    <text x="24" y="210" font-family="'Be Vietnam Pro', sans-serif" font-weight="600" font-size="11" fill="#CBD5E1">?</text><line x1="42" y1="210" x2="236" y2="210" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="24" y="245" font-family="'Be Vietnam Pro', sans-serif" font-weight="600" font-size="11" fill="#CBD5E1">?</text><line x1="42" y1="245" x2="236" y2="245" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="24" y="280" font-family="'Be Vietnam Pro', sans-serif" font-weight="600" font-size="11" fill="#CBD5E1">?</text><line x1="42" y1="280" x2="236" y2="280" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="24" y="315" font-family="'Be Vietnam Pro', sans-serif" font-weight="600" font-size="11" fill="#CBD5E1">?</text><line x1="42" y1="315" x2="236" y2="315" stroke="#E2E8F0" stroke-width="1.5"/>

