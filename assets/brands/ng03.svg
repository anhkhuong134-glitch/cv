    <circle cx="34" cy="301" r="6" fill="#FAFBF8" stroke="#273B4A" stroke-width="1.5"/><line x1="50" y1="305" x2="236" y2="305" stroke="#E2E8F0" stroke-width="1.5"/>

    <text x="130" y="342" font-family="'Be Vietnam Pro', sans-serif" font-size="9" fill="#A0AEC0" text-anchor="middle">nếp gấp · thẻ 01</text>
