    <rect x="24" y="90" width="212" height="230" fill="#FAFBF8" stroke="#E2E8F0" rx="4"/>
    <text x="130" y="195" font-family="'Be Vietnam Pro', sans-serif" font-size="11" fill="#A0AEC0" text-anchor="middle">[ Vùng lưới chấm 5mm ]</text>
