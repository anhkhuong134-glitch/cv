  <!-- Card 3: Ý Tưởng Mới -->
  <g transform="translate(660, 70)">
    <rect x="0" y="0" width="260" height="360" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
