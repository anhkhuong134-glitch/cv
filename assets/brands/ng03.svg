  <text x="500" y="465" font-family="'Be Vietnam Pro', sans-serif" font-size="13" fill="#53647A" text-anchor="middle">Cùng dấu góc gấp đặc trưng nhưng phân loại rõ: Checklist công việc, Danh sách câu hỏi, và Lưới dot phác thảo ý tưởng</text>
